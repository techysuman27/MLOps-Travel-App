apiVersion: v1
kind: Namespace
metadata:
  name: voyage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voyage-api
  namespace: voyage
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: voyage-api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: voyage-api}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: voyage-api:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '1', memory: 1Gi}
          startupProbe:
            httpGet: {path: /health/ready, port: 8000}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: voyage-api
  namespace: voyage
spec:
  selector: {app: voyage-api}
  ports: [{port: 80, targetPort: 8000}]
