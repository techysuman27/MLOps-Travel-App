# Requires a functioning metrics-server. Verify kubectl top pods first.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voyage-api
  namespace: voyage
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: voyage-api}
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
